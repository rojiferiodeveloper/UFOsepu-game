<!doctype html>
<!-- Cuenta atrás para el lanzamiento de UFO SEPU (1 de diciembre). Página de entrada de la repo pública: se dibuja en un
     lienzo de 480x270 como el juego (fondo del título, logo, fuente ufo_negrita). Cuando llega la hora salen dos
     botones: JUGAR (al juego, juego/; en iPhone antes explica cómo añadirlo a la pantalla de inicio) y DESCARGAR PARA
     PC (el instalador de Windows). Abajo, siempre, los botones RÉCORDS (records/) y AYUDA (soporte/). Para verla antes de hora: ?ya
     (y &plataforma=ios).
     La monta Tools/web/publicar_demo.sh junto con las imágenes de img/. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UFO SEPU: la invasión de Quintana</title>
<meta name="description" content="UFO SEPU: la invasión de Quintana. Lanzamiento el 1 de diciembre en iPhone, Android y PC.">
<meta property="og:title" content="UFO SEPU: la invasión de Quintana">
<meta property="og:description" content="Lanzamiento el 1 de diciembre. iPhone, Android y PC.">
<meta property="og:image" content="https://rojiferiodeveloper.github.io/UFOsepu-game/img/cielo.png">
<meta name="theme-color" content="#0e0a18">
<link rel="icon" href="img/icono.png">
<link rel="apple-touch-icon" href="img/icono.png">
<!-- añadida a la pantalla de inicio (iPhone), se abre como app a pantalla completa y salta directa al juego -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UFO SEPU">
<style>
  html, body { margin: 0; height: 100%; background: #07050c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: default; }
  canvas.listo { cursor: pointer; }
  noscript { color: #fad448; font: 16px monospace; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="lienzo" width="480" height="270" aria-label="Cuenta atrás para el lanzamiento de UFO SEPU el 1 de diciembre"></canvas>
<noscript>UFO SEPU: la invasión de Quintana. Lanzamiento el 1 de diciembre.</noscript>
<script>
"use strict";
// 1 de diciembre de 2026, 00:00 en Madrid (hora de invierno, UTC+1)
const LANZAMIENTO = Date.parse("2026-12-01T00:00:00+01:00");
const JUEGO = "juego/";
const RECORDS = "records/";
const SOPORTE = "soporte/";
// El instalador de Windows va en la última Release de la repo pública (lo sube publicar_demo.sh desde el lanzamiento)
const INSTALADOR = "https://github.com/rojiferiodeveloper/UFOsepu-game/releases/latest/download/UFO_SEPU_instalador.exe";
// Fichas de las tiendas: vacías = no sale el botón (se rellenan cuando estén publicadas)
const TIENDA_ANDROID = "";
const TIENDA_IOS = "";
const W = 480, H = 270;
const AMARILLO = "#fad448", CLARO = "#d9d1f2", GRIS = "#9994b3", OSCURO = "#0e0a18", ROJO = "#e2464f";

// Para ver la página de lanzamiento antes de hora: ?ya (y &plataforma=ios para ver lo del iPhone)
const PARAMS = new URLSearchParams(location.search);
const YA = PARAMS.has("ya");
const UA = navigator.userAgent;
const ES_IOS = PARAMS.get("plataforma") === "ios" || /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const ES_APP = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;

// Abierta desde el icono de la pantalla de inicio (iPhone): directamente al juego
if ((YA || Date.now() >= LANZAMIENTO) && ES_APP) location.replace(JUEGO);

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Escala: en píxeles reales enteros (pixel perfect, como el juego) si así casi llena la pantalla; si no (móviles),
// lo que quepa
function ajustar() {
  const dpr = window.devicePixelRatio || 1;
  const cabe = Math.min(innerWidth / W, innerHeight / H);
  const entero = Math.floor(cabe * dpr);
  const css = entero >= 1 && entero >= 0.85 * cabe * dpr ? entero / dpr : cabe;
  lienzo.style.width = (W * css) + "px";
  lienzo.style.height = (H * css) + "px";
}
addEventListener("resize", ajustar);
ajustar();

function cargar(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
}

// --- Fuente BMFont del juego (ufo_negrita): glifos blancos que se tiñen por color ---
const fuente = { chars: {}, alto: 12, tintes: {} };
async function cargarFuente() {
  const [txt, img] = await Promise.all([fetch("img/fuente.fnt").then(r => r.text()), cargar("img/fuente.png")]);
  for (const linea of txt.split("\n")) {
    if (!linea.startsWith("char ")) continue;
    const c = {};
    for (const m of linea.matchAll(/(\w+)=(-?\d+)/g)) c[m[1]] = +m[2];
    fuente.chars[c.id] = c;
  }
  fuente.img = img;
}
function tinte(color) {
  if (!fuente.tintes[color]) {
    const c = document.createElement("canvas");
    c.width = fuente.img.width; c.height = fuente.img.height;
    const x = c.getContext("2d");
    x.drawImage(fuente.img, 0, 0);
    x.globalCompositeOperation = "source-in";
    x.fillStyle = color;
    x.fillRect(0, 0, c.width, c.height);
    fuente.tintes[color] = c;
  }
  return fuente.tintes[color];
}
function ancho(texto, esc = 1) {
  let a = 0;
  for (const ch of texto) a += (fuente.chars[ch.codePointAt(0)] || fuente.chars[32] || { xadvance: 4 }).xadvance;
  return (a - 1) * esc;
}
function escribir(texto, x, y, color, esc = 1, sombra = true) {
  if (sombra) escribirSolo(texto, x + esc, y + esc, OSCURO, esc);
  escribirSolo(texto, x, y, color, esc);
}
function escribirSolo(texto, x, y, color, esc) {
  const t = tinte(color);
  for (const ch of texto) {
    const c = fuente.chars[ch.codePointAt(0)];
    if (!c) { x += 4 * esc; continue; }
    if (c.width) ctx.drawImage(t, c.x, c.y, c.width, c.height, x + c.xoffset * esc, y + c.yoffset * esc, c.width * esc, c.height * esc);
    x += c.xadvance * esc;
  }
}
function centrado(texto, cx, y, color, esc = 1) {
  escribir(texto, Math.round(cx - ancho(texto, esc) / 2), y, color, esc);
}

// --- Escena ---
let cielo, logo, platillo;
const estrellas = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * 110, f: Math.random() * 6.28 }));

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(8,5,15,0.82)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = AMARILLO;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}

function dosCifras(n) { return String(n).padStart(2, "0"); }

let listo = false, finDesde = 0;
function dibujar(ms) {
  const t = ms / 1000;
  botones = [];
  ctx.drawImage(cielo, 0, 0);
  // estrellas que titilan
  for (const e of estrellas) {
    const a = 0.5 + 0.5 * Math.sin(t * 2 + e.f);
    if (a > 0.75) { ctx.fillStyle = "rgba(255,255,255," + (a - 0.4).toFixed(2) + ")"; ctx.fillRect(Math.round(e.x), Math.round(e.y), 1, 1); }
  }
  // el platillo cruza el cielo
  const px = ((t * 22) % (W + 80)) - 40;
  const py = 92 + Math.round(Math.sin(t * 2.2) * 3);
  ctx.drawImage(platillo, Math.round(px), py);
  // logo
  const ly = 16 + Math.round(Math.sin(t * 1.5) * 1);
  ctx.drawImage(logo, Math.round((W - logo.width) / 2), ly);

  const falta = YA ? 0 : Math.max(0, LANZAMIENTO - Date.now());
  if (falta === 0 && !listo) { listo = true; finDesde = ms; lienzo.classList.add("listo"); }

  if (!listo) {
    centrado("LA INVASIÓN EMPIEZA EN", W / 2, 96, CLARO);
    const s = Math.floor(falta / 1000);
    const piezas = [[Math.floor(s / 86400), "DÍAS"], [Math.floor(s / 3600) % 24, "HORAS"], [Math.floor(s / 60) % 60, "MIN"], [s % 60, "SEG"]];
    const bw = 84, bh = 62, sep = 10, x0 = Math.round((W - (bw * 4 + sep * 3)) / 2), y0 = 114;
    piezas.forEach(([v, nombre], i) => {
      const x = x0 + i * (bw + sep);
      panel(x, y0, bw, bh);
      centrado(dosCifras(v), x + bw / 2, y0 + 8, AMARILLO, 3);
      centrado(nombre, x + bw / 2, y0 + bh - 16, GRIS);
    });
    ctx.fillStyle = "rgba(8,5,15,0.7)";
    ctx.fillRect(0, 196, W, 40);
    centrado("1 DE DICIEMBRE", W / 2, 202, AMARILLO, 2);
    centrado("IPHONE · ANDROID · PC", W / 2, 224, CLARO);
  } else {
    eleccion(ms);
  }
  if (!ayudaIOS) {
    boton(116, 244, 120, 20, "► RÉCORDS", () => ir(RECORDS), false);
    boton(244, 244, 120, 20, "AYUDA", () => ir(SOPORTE), false);
  }
  requestAnimationFrame(dibujar);
}

// --- Tras el lanzamiento: dos botones grandes ---
// ► JUGAR lleva al juego (juego/): en Android el propio juego se pone a pantalla completa y en horizontal al pulsar su
// JUGAR; en iPhone/iPad antes se explica cómo añadirlo a la pantalla de inicio (Safari no deja la pantalla completa).
// DESCARGAR PARA PC baja el instalador de Windows. Abajo: próximamente en Google Play y App Store (o sus botones).
let botones = [];
let ayudaIOS = false;
function boton(x, y, w, h, texto, accion, principal, sub) {
  const encima = raton && raton.x >= x && raton.x < x + w && raton.y >= y && raton.y < y + h;
  ctx.fillStyle = principal ? (encima ? "#f05a62" : ROJO) : (encima ? "rgba(60,48,96,0.95)" : "rgba(30,22,52,0.92)");
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = principal ? "#8a1820" : AMARILLO;
  if (principal) ctx.fillRect(x, y + h, w, 2);
  else { ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h); }
  const esc = principal ? 2 : 1;
  const ty = sub ? y + 9 : y + Math.round((h - 12 * esc) / 2);
  centrado(texto, x + w / 2, ty, principal ? "#ffffff" : CLARO, esc);
  if (sub) centrado(sub, x + w / 2, y + h - 17, principal ? "#ffe3e4" : GRIS);
  botones.push({ x, y, w, h, accion });
}

function eleccion(ms) {
  ctx.globalAlpha = Math.min(1, (ms - finDesde) / 400);
  ctx.fillStyle = "rgba(8,5,15,0.78)";
  ctx.fillRect(0, 84, W, 186);
  if (ayudaIOS) {
    centrado("PARA JUGAR A PANTALLA COMPLETA", W / 2, 92, AMARILLO, 1);
    const pasos = ["1. Pulsa el botón COMPARTIR de Safari (el cuadrado con la flecha).",
      "2. Elige AÑADIR A PANTALLA DE INICIO.", "3. Abre UFO SEPU desde ese icono: se juega a pantalla completa."];
    pasos.forEach((t, i) => escribir(t, 40, 114 + i * 18, CLARO));
    boton(140, 172, 200, 40, "► JUGAR YA", () => ir(JUEGO), true);
    boton(190, 224, 100, 20, "◄ VOLVER", () => { ayudaIOS = false; }, false);
  } else {
    centrado("¡YA DISPONIBLE!", W / 2, 92, AMARILLO, 2);
    const bw = 190, bh = 60, sep = 12, x0 = Math.round((W - bw * 2 - sep) / 2), y0 = 124;
    boton(x0, y0, bw, bh, "► JUGAR", () => { if (ES_IOS) ayudaIOS = true; else ir(JUEGO); }, true, "EN EL MÓVIL O EL NAVEGADOR");
    boton(x0 + bw + sep, y0, bw, bh, "DESCARGAR", () => ir(INSTALADOR), true, "PARA PC (WINDOWS) · 40 MB");
    if (TIENDA_ANDROID || TIENDA_IOS) {
      if (TIENDA_ANDROID) boton(x0, 206, bw, 22, "GOOGLE PLAY", () => ir(TIENDA_ANDROID), false);
      if (TIENDA_IOS) boton(x0 + bw + sep, 206, bw, 22, "APP STORE", () => ir(TIENDA_IOS), false);
    } else {
      centrado("PRÓXIMAMENTE EN GOOGLE PLAY Y APP STORE", W / 2, 216, CLARO);
    }
  }
  ctx.globalAlpha = 1;
}

function ir(url) { location.href = url; }

// Ratón/dedo en coordenadas del lienzo (480x270)
let raton = null;
function aLienzo(ev) {
  const r = lienzo.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height };
}
lienzo.addEventListener("pointermove", (ev) => {
  raton = aLienzo(ev);
  lienzo.style.cursor = botones.some(b => raton.x >= b.x && raton.x < b.x + b.w && raton.y >= b.y && raton.y < b.y + b.h) ? "pointer" : "default";
});
lienzo.addEventListener("pointerleave", () => { raton = null; });
lienzo.addEventListener("click", (ev) => {
  const p = aLienzo(ev);
  const b = botones.find(b => p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h);
  if (b) b.accion();
});

Promise.all([cargar("img/cielo.png"), cargar("img/logo.png"), cargar("img/platillo.png"), cargarFuente()])
  .then(([c, l, p]) => { cielo = c; logo = l; platillo = p; requestAnimationFrame(dibujar); })
  .catch(() => { document.body.innerHTML = '<p style="color:#fad448;font:16px monospace;text-align:center;padding:16px">UFO SEPU: la invasión de Quintana. Lanzamiento el 1 de diciembre.</p>'; });
</script>
</body>
</html>
