<!doctype html>
<!-- Cuenta atrás para el lanzamiento de UFO SEPU (1 de diciembre). Página de entrada de la repo pública: se dibuja en un
     lienzo de 480x270 como el juego (fondo del título, logo, fuente ufo_negrita) y, cuando llega la hora, lleva al
     juego (juego/). La monta Tools/web/publicar_demo.sh junto con las imágenes de img/. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UFO SEPU: la invasión de Quintana</title>
<meta name="description" content="UFO SEPU: la invasión de Quintana. Lanzamiento el 1 de diciembre en iPhone, Android y PC.">
<meta property="og:title" content="UFO SEPU: la invasión de Quintana">
<meta property="og:description" content="Lanzamiento el 1 de diciembre. iPhone, Android y PC.">
<meta property="og:image" content="https://rojiferiodeveloper.github.io/UFOsepu-game/img/cielo.png">
<meta name="theme-color" content="#0e0a18">
<link rel="icon" href="img/icono.png">
<link rel="apple-touch-icon" href="img/icono.png">
<style>
  html, body { margin: 0; height: 100%; background: #07050c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: default; }
  canvas.listo { cursor: pointer; }
  noscript { color: #fad448; font: 16px monospace; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="lienzo" width="480" height="270" aria-label="Cuenta atrás para el lanzamiento de UFO SEPU el 1 de diciembre"></canvas>
<noscript>UFO SEPU: la invasión de Quintana. Lanzamiento el 1 de diciembre.</noscript>
<script>
"use strict";
// 1 de diciembre de 2026, 00:00 en Madrid (hora de invierno, UTC+1)
const LANZAMIENTO = Date.parse("2026-12-01T00:00:00+01:00");
const JUEGO = "juego/";
const W = 480, H = 270;
const AMARILLO = "#fad448", CLARO = "#d9d1f2", GRIS = "#9994b3", OSCURO = "#0e0a18";

// Si ya ha salido, directamente al juego
if (Date.now() >= LANZAMIENTO) location.replace(JUEGO);

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Escala: en píxeles reales enteros (pixel perfect, como el juego) si así casi llena la pantalla; si no (móviles),
// lo que quepa
function ajustar() {
  const dpr = window.devicePixelRatio || 1;
  const cabe = Math.min(innerWidth / W, innerHeight / H);
  const entero = Math.floor(cabe * dpr);
  const css = entero >= 1 && entero >= 0.85 * cabe * dpr ? entero / dpr : cabe;
  lienzo.style.width = (W * css) + "px";
  lienzo.style.height = (H * css) + "px";
}
addEventListener("resize", ajustar);
ajustar();

function cargar(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
}

// --- Fuente BMFont del juego (ufo_negrita): glifos blancos que se tiñen por color ---
const fuente = { chars: {}, alto: 12, tintes: {} };
async function cargarFuente() {
  const [txt, img] = await Promise.all([fetch("img/fuente.fnt").then(r => r.text()), cargar("img/fuente.png")]);
  for (const linea of txt.split("\n")) {
    if (!linea.startsWith("char ")) continue;
    const c = {};
    for (const m of linea.matchAll(/(\w+)=(-?\d+)/g)) c[m[1]] = +m[2];
    fuente.chars[c.id] = c;
  }
  fuente.img = img;
}
function tinte(color) {
  if (!fuente.tintes[color]) {
    const c = document.createElement("canvas");
    c.width = fuente.img.width; c.height = fuente.img.height;
    const x = c.getContext("2d");
    x.drawImage(fuente.img, 0, 0);
    x.globalCompositeOperation = "source-in";
    x.fillStyle = color;
    x.fillRect(0, 0, c.width, c.height);
    fuente.tintes[color] = c;
  }
  return fuente.tintes[color];
}
function ancho(texto, esc = 1) {
  let a = 0;
  for (const ch of texto) a += (fuente.chars[ch.codePointAt(0)] || fuente.chars[32] || { xadvance: 4 }).xadvance;
  return (a - 1) * esc;
}
function escribir(texto, x, y, color, esc = 1, sombra = true) {
  if (sombra) escribirSolo(texto, x + esc, y + esc, OSCURO, esc);
  escribirSolo(texto, x, y, color, esc);
}
function escribirSolo(texto, x, y, color, esc) {
  const t = tinte(color);
  for (const ch of texto) {
    const c = fuente.chars[ch.codePointAt(0)];
    if (!c) { x += 4 * esc; continue; }
    if (c.width) ctx.drawImage(t, c.x, c.y, c.width, c.height, x + c.xoffset * esc, y + c.yoffset * esc, c.width * esc, c.height * esc);
    x += c.xadvance * esc;
  }
}
function centrado(texto, cx, y, color, esc = 1) {
  escribir(texto, Math.round(cx - ancho(texto, esc) / 2), y, color, esc);
}

// --- Escena ---
let cielo, logo, platillo;
const estrellas = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * 110, f: Math.random() * 6.28 }));

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(8,5,15,0.82)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = AMARILLO;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}

function dosCifras(n) { return String(n).padStart(2, "0"); }

let listo = false, finDesde = 0;
function dibujar(ms) {
  const t = ms / 1000;
  ctx.drawImage(cielo, 0, 0);
  // estrellas que titilan
  for (const e of estrellas) {
    const a = 0.5 + 0.5 * Math.sin(t * 2 + e.f);
    if (a > 0.75) { ctx.fillStyle = "rgba(255,255,255," + (a - 0.4).toFixed(2) + ")"; ctx.fillRect(Math.round(e.x), Math.round(e.y), 1, 1); }
  }
  // el platillo cruza el cielo
  const px = ((t * 22) % (W + 80)) - 40;
  const py = 92 + Math.round(Math.sin(t * 2.2) * 3);
  ctx.drawImage(platillo, Math.round(px), py);
  // logo
  const ly = 16 + Math.round(Math.sin(t * 1.5) * 1);
  ctx.drawImage(logo, Math.round((W - logo.width) / 2), ly);

  const falta = Math.max(0, LANZAMIENTO - Date.now());
  if (falta === 0 && !listo) { listo = true; finDesde = ms; lienzo.classList.add("listo"); }

  if (!listo) {
    centrado("LA INVASIÓN EMPIEZA EN", W / 2, 96, CLARO);
    const s = Math.floor(falta / 1000);
    const piezas = [[Math.floor(s / 86400), "DÍAS"], [Math.floor(s / 3600) % 24, "HORAS"], [Math.floor(s / 60) % 60, "MIN"], [s % 60, "SEG"]];
    const bw = 84, bh = 62, sep = 10, x0 = Math.round((W - (bw * 4 + sep * 3)) / 2), y0 = 114;
    piezas.forEach(([v, nombre], i) => {
      const x = x0 + i * (bw + sep);
      panel(x, y0, bw, bh);
      centrado(dosCifras(v), x + bw / 2, y0 + 8, AMARILLO, 3);
      centrado(nombre, x + bw / 2, y0 + bh - 16, GRIS);
    });
    ctx.fillStyle = "rgba(8,5,15,0.7)";
    ctx.fillRect(0, 196, W, 40);
    centrado("1 DE DICIEMBRE", W / 2, 202, AMARILLO, 2);
    centrado("IPHONE · ANDROID · PC", W / 2, 224, CLARO);
  } else {
    const parpadeo = Math.floor((ms - finDesde) / 300) % 2 === 0;
    ctx.fillStyle = "rgba(8,5,15,0.75)";
    ctx.fillRect(0, 108, W, 84);
    centrado("¡YA DISPONIBLE!", W / 2, 120, AMARILLO, 3);
    if (parpadeo) centrado("PULSA PARA JUGAR", W / 2, 168, CLARO);
    if (ms - finDesde > 3500) location.href = JUEGO;
  }
  requestAnimationFrame(dibujar);
}

lienzo.addEventListener("click", () => { if (listo) location.href = JUEGO; });

Promise.all([cargar("img/cielo.png"), cargar("img/logo.png"), cargar("img/platillo.png"), cargarFuente()])
  .then(([c, l, p]) => { cielo = c; logo = l; platillo = p; requestAnimationFrame(dibujar); })
  .catch(() => { document.body.innerHTML = '<p style="color:#fad448;font:16px monospace;text-align:center;padding:16px">UFO SEPU: la invasión de Quintana. Lanzamiento el 1 de diciembre.</p>'; });
</script>
</body>
</html>
