<!doctype html>
<!-- Cuenta atrás para el lanzamiento de UFO SEPU (sábado 28 de noviembre, 19:00). Página de entrada de la repo pública: se dibuja en un
     lienzo de 480x270 como el juego (fondo del título, logo, fuente ufo_negrita). Cuando llega la hora salen tres
     botones, uno por plataforma: IPHONE (la ficha del App Store), ANDROID (android/: cómo unirse a la prueba cerrada por
     el grupo de Google) y PC (el instalador de Windows). El de tu aparato sale resaltado; el que aún no está listo sale
     en gris con PRÓXIMAMENTE. Abajo, siempre, RÉCORDS (records/) y AYUDA (soporte/).
     Para verla antes de hora: ?ya, y &plataforma=ios|android|pc para ver cada aparato; &todo para verlo todo listo.
     La monta Tools/web/publicar_demo.sh junto con las imágenes de img/. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UFO SEPU: la invasión de Quintana</title>
<meta name="description" content="UFO SEPU: la invasión de Quintana. Un juego de pixel art del barrio de Quintana para iPhone, Android y PC.">
<meta property="og:title" content="UFO SEPU: la invasión de Quintana">
<meta property="og:description" content="Lanzamiento el sábado 28 de noviembre a las 19:00. iPhone, Android y PC.">
<meta property="og:image" content="https://rojiferiodeveloper.github.io/UFOsepu-game/img/cielo.png">
<meta name="theme-color" content="#0e0a18">
<link rel="icon" href="img/icono.png">
<link rel="apple-touch-icon" href="img/icono.png">
<style>
  html, body { margin: 0; height: 100%; background: #07050c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: default; }
  canvas.listo { cursor: pointer; }
  noscript { color: #fad448; font: 16px monospace; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="lienzo" width="480" height="270" aria-label="Cuenta atrás para el lanzamiento de UFO SEPU el 28 de noviembre a las 19:00"></canvas>
<noscript>UFO SEPU: la invasión de Quintana. Lanzamiento el sábado 28 de noviembre a las 19:00.</noscript>
<script>
"use strict";
// Sábado 28 de noviembre de 2026, 19:00 en Madrid (hora de invierno, UTC+1). Antes era el 1 de diciembre: se adelantó.
const LANZAMIENTO = Date.parse("2026-11-28T19:00:00+01:00");
const RECORDS = "records/";
const SOPORTE = "soporte/";
const ANDROID = "android/";
// iPhone/iPad: la ficha del App Store. El botón se activa solo cuando Apple dice que la app ya está publicada (consulta
// a itunes.apple.com al cargar), así no hay que volver a subir la web el día que salga.
const APP_ID = "6838638980";
const TIENDA_IOS = "https://apps.apple.com/es/app/id" + APP_ID;
// Android: true cuando la prueba cerrada esté lista (el grupo y el enlace de tester van en android/index.html)
const ANDROID_LISTO = true;
// PC: el instalador de Windows, en la última Release de la repo pública (lo sube Tools/build/publicar_windows.sh)
const INSTALADOR = "https://github.com/rojiferiodeveloper/UFOsepu-game/releases/latest/download/UFO_SEPU_instalador.exe";
const PC_LISTO = true;
const W = 480, H = 270;
const AMARILLO = "#fad448", CLARO = "#d9d1f2", GRIS = "#9994b3", OSCURO = "#0e0a18", ROJO = "#e2464f";

// Para ver la página de lanzamiento antes de hora: ?ya (&plataforma=ios|android|pc, &todo = todo listo)
const PARAMS = new URLSearchParams(location.search);
const YA = PARAMS.has("ya");
const TODO = PARAMS.has("todo");
const UA = navigator.userAgent;
const PLATAFORMA = PARAMS.get("plataforma") || (/iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1) ? "ios"
  : /Android/.test(UA) ? "android" : "pc");
let iosListo = TODO;
if (!TODO) {
  // ¿ya está en el App Store? (JSONP: la API de Apple no deja leerla con fetch desde otra web)
  window.alAppStore = (r) => { iosListo = !!(r && r.resultCount > 0); };
  const sc = document.createElement("script");
  sc.src = "https://itunes.apple.com/lookup?id=" + APP_ID + "&country=es&callback=alAppStore";
  document.head.appendChild(sc);
}

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Escala: en píxeles reales enteros (pixel perfect, como el juego) si así casi llena la pantalla; si no (móviles),
// lo que quepa
function ajustar() {
  const dpr = window.devicePixelRatio || 1;
  const cabe = Math.min(innerWidth / W, innerHeight / H);
  const entero = Math.floor(cabe * dpr);
  const css = entero >= 1 && entero >= 0.85 * cabe * dpr ? entero / dpr : cabe;
  lienzo.style.width = (W * css) + "px";
  lienzo.style.height = (H * css) + "px";
}
addEventListener("resize", ajustar);
ajustar();

function cargar(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
}

// --- Fuente BMFont del juego (ufo_negrita): glifos blancos que se tiñen por color ---
const fuente = { chars: {}, alto: 12, tintes: {} };
async function cargarFuente() {
  const [txt, img] = await Promise.all([fetch("img/fuente.fnt").then(r => r.text()), cargar("img/fuente.png")]);
  for (const linea of txt.split("\n")) {
    if (!linea.startsWith("char ")) continue;
    const c = {};
    for (const m of linea.matchAll(/(\w+)=(-?\d+)/g)) c[m[1]] = +m[2];
    fuente.chars[c.id] = c;
  }
  fuente.img = img;
}
function tinte(color) {
  if (!fuente.tintes[color]) {
    const c = document.createElement("canvas");
    c.width = fuente.img.width; c.height = fuente.img.height;
    const x = c.getContext("2d");
    x.drawImage(fuente.img, 0, 0);
    x.globalCompositeOperation = "source-in";
    x.fillStyle = color;
    x.fillRect(0, 0, c.width, c.height);
    fuente.tintes[color] = c;
  }
  return fuente.tintes[color];
}
function ancho(texto, esc = 1) {
  let a = 0;
  for (const ch of texto) a += (fuente.chars[ch.codePointAt(0)] || fuente.chars[32] || { xadvance: 4 }).xadvance;
  return (a - 1) * esc;
}
function escribir(texto, x, y, color, esc = 1, sombra = true) {
  if (sombra) escribirSolo(texto, x + esc, y + esc, OSCURO, esc);
  escribirSolo(texto, x, y, color, esc);
}
function escribirSolo(texto, x, y, color, esc) {
  const t = tinte(color);
  for (const ch of texto) {
    const c = fuente.chars[ch.codePointAt(0)];
    if (!c) { x += 4 * esc; continue; }
    if (c.width) ctx.drawImage(t, c.x, c.y, c.width, c.height, x + c.xoffset * esc, y + c.yoffset * esc, c.width * esc, c.height * esc);
    x += c.xadvance * esc;
  }
}
function centrado(texto, cx, y, color, esc = 1) {
  escribir(texto, Math.round(cx - ancho(texto, esc) / 2), y, color, esc);
}

// --- Escena ---
let cielo, logo, platillo;
const estrellas = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * 110, f: Math.random() * 6.28 }));

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(8,5,15,0.82)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = AMARILLO;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}

function dosCifras(n) { return String(n).padStart(2, "0"); }

let listo = false, finDesde = 0;
function dibujar(ms) {
  const t = ms / 1000;
  botones = [];
  ctx.drawImage(cielo, 0, 0);
  // estrellas que titilan
  for (const e of estrellas) {
    const a = 0.5 + 0.5 * Math.sin(t * 2 + e.f);
    if (a > 0.75) { ctx.fillStyle = "rgba(255,255,255," + (a - 0.4).toFixed(2) + ")"; ctx.fillRect(Math.round(e.x), Math.round(e.y), 1, 1); }
  }
  // el platillo cruza el cielo
  const px = ((t * 22) % (W + 80)) - 40;
  const py = 92 + Math.round(Math.sin(t * 2.2) * 3);
  ctx.drawImage(platillo, Math.round(px), py);
  // logo
  const ly = 16 + Math.round(Math.sin(t * 1.5) * 1);
  ctx.drawImage(logo, Math.round((W - logo.width) / 2), ly);

  const falta = YA ? 0 : Math.max(0, LANZAMIENTO - Date.now());
  if (falta === 0 && !listo) { listo = true; finDesde = ms; lienzo.classList.add("listo"); }

  if (!listo) {
    centrado("LA INVASIÓN EMPIEZA EN", W / 2, 96, CLARO);
    const s = Math.floor(falta / 1000);
    const piezas = [[Math.floor(s / 86400), "DÍAS"], [Math.floor(s / 3600) % 24, "HORAS"], [Math.floor(s / 60) % 60, "MIN"], [s % 60, "SEG"]];
    const bw = 84, bh = 62, sep = 10, x0 = Math.round((W - (bw * 4 + sep * 3)) / 2), y0 = 114;
    piezas.forEach(([v, nombre], i) => {
      const x = x0 + i * (bw + sep);
      panel(x, y0, bw, bh);
      centrado(dosCifras(v), x + bw / 2, y0 + 8, AMARILLO, 3);
      centrado(nombre, x + bw / 2, y0 + bh - 16, GRIS);
    });
    ctx.fillStyle = "rgba(8,5,15,0.7)";
    ctx.fillRect(0, 196, W, 40);
    centrado("28 DE NOVIEMBRE · 19:00 H", W / 2, 202, AMARILLO, 2);
    centrado("IPHONE · ANDROID · PC", W / 2, 224, CLARO);
  } else {
    eleccion(ms);
  }
  boton(116, 244, 120, 20, "► RÉCORDS", () => ir(RECORDS), false);
  boton(244, 244, 120, 20, "AYUDA", () => ir(SOPORTE), false);
  requestAnimationFrame(dibujar);
}

// --- Tras el lanzamiento: un botón grande por plataforma ---
// El de tu aparato va en rojo; los otros, oscuros con borde; el que aún no está listo, en gris con PRÓXIMAMENTE.
let botones = [];
function boton(x, y, w, h, texto, accion, principal, sub, apagado) {
  const encima = !apagado && raton && raton.x >= x && raton.x < x + w && raton.y >= y && raton.y < y + h;
  if (apagado) ctx.fillStyle = "rgba(30,26,42,0.85)";
  else ctx.fillStyle = principal ? (encima ? "#f05a62" : ROJO) : (encima ? "rgba(60,48,96,0.95)" : "rgba(30,22,52,0.92)");
  ctx.fillRect(x, y, w, h);
  if (apagado) { ctx.fillStyle = "#4a4460"; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h); }
  else if (principal) { ctx.fillStyle = "#8a1820"; ctx.fillRect(x, y + h, w, 2); }
  else { ctx.fillStyle = AMARILLO; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h); }
  const grande = h >= 40;
  const esc = grande ? 2 : 1;
  const ty = sub ? y + (grande ? 12 : 4) : y + Math.round((h - 12 * esc) / 2);
  centrado(texto, x + w / 2, ty, apagado ? "#7d7894" : (principal ? "#ffffff" : CLARO), esc);
  if (sub) centrado(sub, x + w / 2, y + h - 18, apagado ? "#7d7894" : (principal ? "#ffe3e4" : GRIS));
  if (!apagado) botones.push({ x, y, w, h, accion });
}

function eleccion(ms) {
  ctx.globalAlpha = Math.min(1, (ms - finDesde) / 400);
  ctx.fillStyle = "rgba(8,5,15,0.78)";
  ctx.fillRect(0, 84, W, 186);
  centrado("¡YA DISPONIBLE!", W / 2, 92, AMARILLO, 2);
  const opciones = [
    { id: "ios", texto: "IPHONE", listo: iosListo, sub: "Y IPAD · APP STORE", ir: TIENDA_IOS },
    { id: "android", texto: "ANDROID", listo: ANDROID_LISTO || TODO, sub: "VERSIÓN DE PRUEBA", ir: ANDROID },
    { id: "pc", texto: "PC", listo: PC_LISTO || TODO, sub: "WINDOWS · 40 MB", ir: INSTALADOR },
  ];
  const bw = 142, bh = 62, sep = 9, x0 = Math.round((W - bw * 3 - sep * 2) / 2), y0 = 124;
  opciones.forEach((o, i) => boton(x0 + i * (bw + sep), y0, bw, bh, o.texto, () => ir(o.ir), o.id === PLATAFORMA,
    o.listo ? o.sub : "PRÓXIMAMENTE", !o.listo));
  centrado("GRATIS · SIN ANUNCIOS · SIN COMPRAS", W / 2, 206, CLARO);
  ctx.globalAlpha = 1;
}

function ir(url) { location.href = url; }

// Ratón/dedo en coordenadas del lienzo (480x270)
let raton = null;
function aLienzo(ev) {
  const r = lienzo.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height };
}
lienzo.addEventListener("pointermove", (ev) => {
  raton = aLienzo(ev);
  lienzo.style.cursor = botones.some(b => raton.x >= b.x && raton.x < b.x + b.w && raton.y >= b.y && raton.y < b.y + b.h) ? "pointer" : "default";
});
lienzo.addEventListener("pointerleave", () => { raton = null; });
lienzo.addEventListener("click", (ev) => {
  const p = aLienzo(ev);
  const b = botones.find(b => p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h);
  if (b) b.accion();
});

Promise.all([cargar("img/cielo.png"), cargar("img/logo.png"), cargar("img/platillo.png"), cargarFuente()])
  .then(([c, l, p]) => { cielo = c; logo = l; platillo = p; requestAnimationFrame(dibujar); })
  .catch(() => { document.body.innerHTML = '<p style="color:#fad448;font:16px monospace;text-align:center;padding:16px">UFO SEPU: la invasión de Quintana. Lanzamiento el sábado 28 de noviembre a las 19:00.</p>'; });
</script>
</body>
</html>
